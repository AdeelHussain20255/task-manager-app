<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App</title>
    <style>
        /* Clean, basic styling to meet the "styled front end" requirement */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; color: #333; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .btn-add { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-add:hover { background: #218838; }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        li:last-child { border-bottom: none; }
        li.completed span { text-decoration: line-through; color: #999; }
        .actions button { margin-left: 5px; padding: 6px 10px; font-size: 0.85em; border: none; border-radius: 4px; cursor: pointer; color: white;}
        .btn-delete { background: #dc3545; }
        .btn-delete:hover { background: #c82333; }
        .btn-toggle { background: #007bff; }
        .btn-toggle:hover { background: #0069d9; }
    </style>
</head>
<body>

<div class="container">
    <h1>My Tasks</h1>
    <div class="input-group">
        <input type="text" id="taskTitle" placeholder="What needs to be done?">
        <button class="btn-add" onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    // Because we serve this HTML from the FastAPI root, we can use relative paths
    const API_URL = '/tasks';

    // 1. READ: Fetch and display tasks on load
    async function fetchTasks() {
        const response = await fetch(API_URL);
        const tasks = await response.json();
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        
        tasks.forEach(task => {
            const li = document.createElement('li');
            if (task.is_complete) li.classList.add('completed');
            
            li.innerHTML = `
                <span>${task.title}</span>
                <div class="actions">
                    <button class="btn-toggle" onclick="toggleTask(${task.id}, ${task.is_complete})">
                        ${task.is_complete ? 'Undo' : 'Complete'}
                    </button>
                    <button class="btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                </div>
            `;
            taskList.appendChild(li);
        });
    }

    // 2. CREATE: Add a new task
    async function addTask() {
        const titleInput = document.getElementById('taskTitle');
        const title = titleInput.value.trim();
        
        // Frontend validation
        if (!title) {
            alert('Task title cannot be empty!');
            return;
        }

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title, description: "" })
        });
        
        titleInput.value = '';
        fetchTasks();
    }

    // 3. UPDATE: Toggle completion status
    async function toggleTask(id, currentStatus) {
        await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ is_complete: !currentStatus })
        });
        fetchTasks();
    }

    // 4. DELETE: Remove a task
    async function deleteTask(id) {
        await fetch(`${API_URL}/${id}`, {
            method: 'DELETE'
        });
        fetchTasks();
    }

    // Initial fetch to populate the list
    fetchTasks();
</script>

</body>
</html>
